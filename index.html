<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>FamilyHub Pro</title>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --primary-blue: #007aff;
            --success-green: #34c759;
            --danger-red: #ff3b30;
            --fav-yellow: #ffcc00;
            --tab-bar-bg: rgba(255, 255, 255, 0.8);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding-bottom: 90px;
        }

        section { display: none; padding: 20px; animation: fadeIn 0.3s ease; }
        section.active { display: flex; flex-direction: column; align-items: center; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        h1 { margin-top: 40px; font-size: 28px; color: #1c1c1e; }

        /* ROUTINE STYLE */
        .progress-container { width: 90%; height: 15px; background: #e5e5ea; border-radius: 10px; margin: 20px 0; overflow: hidden; }
        #progress-bar { width: 0%; height: 100%; background: var(--primary-blue); transition: width 0.4s; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; }
        .card { background: white; border-radius: 20px; height: 130px; display: flex; flex-direction: column; justify-content: center; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 3px solid transparent; transition: 0.2s; -webkit-tap-highlight-color: transparent; }
        .card.done { background: var(--success-green); color: white; transform: scale(0.95); }
        .card .icon { font-size: 40px; margin-bottom: 5px; }

        /* KONTAKTE FORM & CARDS */
        .input-group { background: white; width: 100%; padding: 15px; border-radius: 20px; margin-bottom: 20px; box-sizing: border-box; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        input, select { width: 100%; padding: 12px; margin: 5px 0; border: 1px solid #d1d1d6; border-radius: 10px; font-size: 16px; box-sizing: border-box; }
        .add-btn { width: 100%; background: var(--primary-blue); color: white; border: none; padding: 12px; border-radius: 10px; font-weight: bold; margin-top: 10px; }
        
        .contact-card { background: white; width: 100%; padding: 15px; border-radius: 20px; margin-bottom: 12px; box-sizing: border-box; box-shadow: 0 2px 8px rgba(0,0,0,0.05); transition: 0.3s; }
        .contact-main { display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .contact-info { display: flex; flex-direction: column; }
        .contact-actions { display: flex; align-items: center; gap: 12px; }
        
        .contact-details { display: none; margin-top: 15px; padding-top: 15px; border-top: 1px solid #eee; font-size: 14px; color: #666; line-height: 1.6; }
        .contact-details.show { display: block; }
        
        .call-btn { background: var(--success-green); color: white; padding: 8px 15px; border-radius: 20px; text-decoration: none; font-weight: bold; font-size: 13px; }
        .fav-btn { color: #ccc; background: none; border: none; font-size: 20px; }
        .fav-btn.active { color: var(--fav-yellow); }
        .del-btn { color: var(--danger-red); background: none; border: none; font-size: 16px; margin-left: 5px;}

        /* TAB BAR */
        .tab-bar { position: fixed; bottom: 0; width: 100%; height: 75px; background: var(--tab-bar-bg); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); display: flex; justify-content: space-around; align-items: center; border-top: 0.5px solid #d1d1d6; padding-bottom: env(safe-area-inset-bottom); }
        .tab-item { display: flex; flex-direction: column; align-items: center; color: #8e8e93; font-size: 10px; text-decoration: none; width: 33%; }
        .tab-item.active { color: var(--primary-blue); }
        .tab-item i { font-size: 22px; margin-bottom: 4px; }

        #confetti { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 80px; display: none; z-index: 100; pointer-events: none; }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <section id="routine" class="active">
        <h1>Routine 🌙</h1>
        <div class="progress-container"><div id="progress-bar"></div></div>
        <div class="grid">
            <div class="card" onclick="toggleTask(this, 0)"><span class="icon">🍎</span><span class="label">Abendessen</span></div>
            <div class="card" onclick="toggleTask(this, 1)"><span class="icon">🧸</span><span class="label">Aufräumen</span></div>
            <div class="card" onclick="toggleTask(this, 2)"><span class="icon">🪥</span><span class="label">Zähneputzen</span></div>
            <div class="card" onclick="toggleTask(this, 3)"><span class="icon">👚</span><span class="label">Schlafanzug</span></div>
            <div class="card" onclick="toggleTask(this, 4)"><span class="icon">🧺</span><span class="label">Wäschesack</span></div>    
            <div class="card" onclick="toggleTask(this, 5)"><span class="icon">🪮</span><span class="label">Haarekämmen</span></div>
        </div>
        <div id="confetti">🎉</div>
    </section>

    <section id="calendar">
        <h1>Kalender 📅</h1>
        <div id="birthdayList" style="width: 100%;"></div>
        <div class="contact-card"><div><strong>Morgen:</strong> Restmüll 🗑️</div></div>
    </section>

    <section id="contacts">
        <h1>Kontakte 📞</h1>
        <div class="input-group">
            <input type="text" id="contactName" placeholder="Name">
            <input type="tel" id="contactPhone" placeholder="Telefonnummer">
            <input type="text" id="contactRelation" placeholder="Beziehung (z.B. Familie, Arzt)">
            <input type="date" id="contactBday" placeholder="Geburtstag">
            <input type="text" id="contactAddress" placeholder="Adresse">
            <button class="add-btn" onclick="saveNewContact()">Kontakt hinzufügen</button>
        </div>
        <div id="contactsList" style="width: 100%;"></div>
    </section>

    <nav class="tab-bar">
        <a href="#" class="tab-item active" onclick="showTab('routine', this)">
            <i class="fas fa-check-circle"></i><span>Routine</span>
        </a>
        <a href="#" class="tab-item" onclick="showTab('calendar', this)">
            <i class="fas fa-calendar-alt"></i><span>Kalender</span>
        </a>
        <a href="#" class="tab-item" onclick="showTab('contacts', this)">
            <i class="fas fa-phone-alt"></i><span>Kontakte</span>
        </a>
    </nav>

    <script>
        function showTab(tabId, element) {
            document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
            element.classList.add('active');
            if(tabId === 'calendar') renderBirthdays();
        }

        window.onload = function() {
            const savedRoutine = JSON.parse(localStorage.getItem('routineState')) || [false, false, false, false, false, false];
            const cards = document.querySelectorAll('#routine .card');
            cards.forEach((card, index) => { if (savedRoutine[index]) card.classList.add('done'); });
            updateProgress();
            renderContacts();
        };

        function toggleTask(element, index) {
            element.classList.toggle('done');
            const cards = document.querySelectorAll('#routine .card');
            const state = Array.from(cards).map(card => card.classList.contains('done'));
            localStorage.setItem('routineState', JSON.stringify(state));
            updateProgress();
            if (navigator.vibrate) navigator.vibrate(40);
        }

        function updateProgress() {
            const cards = document.querySelectorAll('#routine .card');
            const done = document.querySelectorAll('#routine .card.done').length;
            document.getElementById('progress-bar').style.width = (done/cards.length*100) + '%';
            if (done === cards.length && done > 0) {
                document.getElementById('confetti').style.display = 'block';
                setTimeout(() => { document.getElementById('confetti').style.display = 'none'; }, 3000);
            }
        }

        // --- KONTAKTE LOGIK ---
        function saveNewContact() {
            const name = document.getElementById('contactName').value;
            const phone = document.getElementById('contactPhone').value;
            const relation = document.getElementById('contactRelation').value;
            const bday = document.getElementById('contactBday').value;
            const addr = document.getElementById('contactAddress').value;

            if (name && phone) {
                let contacts = JSON.parse(localStorage.getItem('familyContacts')) || [];
                contacts.push({ name, phone, relation, bday, addr, fav: false, id: Date.now() });
                localStorage.setItem('familyContacts', JSON.stringify(contacts));
                ["contactName", "contactPhone", "contactRelation", "contactBday", "contactAddress"].forEach(id => document.getElementById(id).value = '');
                renderContacts();
            }
        }

        function toggleFav(id) {
            let contacts = JSON.parse(localStorage.getItem('familyContacts')) || [];
            const index = contacts.findIndex(c => c.id === id);
            contacts[index].fav = !contacts[index].fav;
            localStorage.setItem('familyContacts', JSON.stringify(contacts));
            renderContacts();
        }

        function deleteContact(id) {
            if(!confirm("Löschen?")) return;
            let contacts = JSON.parse(localStorage.getItem('familyContacts')) || [];
            contacts = contacts.filter(c => c.id !== id);
            localStorage.setItem('familyContacts', JSON.stringify(contacts));
            renderContacts();
        }

        function toggleDetails(id) {
            document.getElementById('details-' + id).classList.toggle('show');
        }

        function renderContacts() {
            const list = document.getElementById('contactsList');
            let contacts = JSON.parse(localStorage.getItem('familyContacts')) || [];
            
            // Sortierung: Favoriten zuerst
            contacts.sort((a, b) => (b.fav === a.fav) ? 0 : b.fav ? 1 : -1);
            
            list.innerHTML = '';
            contacts.forEach((c) => {
                list.innerHTML += `
                    <div class="contact-card">
                        <div class="contact-main">
                            <div class="contact-info" onclick="toggleDetails(${c.id})">
                                <strong>${c.fav ? '⭐ ' : ''}${c.name}</strong>
                                <small>${c.relation || 'Kontakt'}</small>
                            </div>
                            <div class="contact-actions">
                                <a href="tel:${c.phone}" class="call-btn"><i class="fas fa-phone"></i></a>
                                <button class="fav-btn ${c.fav ? 'active' : ''}" onclick="toggleFav(${c.id})"><i class="fas fa-star"></i></button>
                                <button class="del-btn" onclick="deleteContact(${c.id})"><i class="fas fa-trash"></i></button>
                            </div>
                        </div>
                        <div id="details-${c.id}" class="contact-details">
                            <p><strong>Telefon:</strong> ${c.phone}</p>
                            ${c.bday ? `<p><strong>Geburtstag:</strong> ${new Date(c.bday).toLocaleDateString('de-DE')}</p>` : ''}
                            ${c.addr ? `<p><strong>Adresse:</strong> ${c.addr}</p>` : ''}
                        </div>
                    </div>
                `;
            });
        }

        function renderBirthdays() {
            const bdayContainer = document.getElementById('birthdayList');
            const contacts = JSON.parse(localStorage.getItem('familyContacts')) || [];
            const upcoming = contacts.filter(c => c.bday);
            
            bdayContainer.innerHTML = '<h3>Geburtstage 🎂</h3>';
            if(upcoming.length === 0) bdayContainer.innerHTML += '<p>Keine Geburtstage hinterlegt.</p>';
            
            upcoming.forEach(c => {
                bdayContainer.innerHTML += `
                    <div class="contact-card">
                        <div><strong>${c.name}</strong><br><small>Geburtstag am: ${new Date(c.bday).toLocaleDateString('de-DE')}</small></div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
