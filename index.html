<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>FamilyHub</title>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --primary-blue: #007aff;
            --success-green: #34c759;
            --tab-bar-bg: rgba(255, 255, 255, 0.8);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding-bottom: 80px; /* Platz für Tab-Bar */
            -webkit-user-select: none;
        }

        /* Navigations-Logik: Bereiche verstecken */
        section {
            display: none;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }

        section.active {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; } to { opacity: 1; }
        }

        h1 { margin-top: 40px; font-size: 28px; color: #1c1c1e; }

        /* --- STYLES AUS DER ROUTINE --- */
        .progress-container { width: 90%; height: 15px; background: #e5e5ea; border-radius: 10px; margin: 20px 0; overflow: hidden; }
        #progress-bar { width: 0%; height: 100%; background: var(--primary-blue); transition: width 0.4s; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; }
        .card { background: white; border-radius: 20px; height: 140px; display: flex; flex-direction: column; justify-content: center; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 3px solid transparent; transition: 0.2s; }
        .card.done { background: var(--success-green); color: white; transform: scale(0.95); }
        .card .icon { font-size: 40px; }

        /* --- TAB BAR STYLE --- */
        .tab-bar {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 70px;
            background: var(--tab-bar-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 0.5px solid #d1d1d6;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #8e8e93;
            font-size: 10px;
            text-decoration: none;
            width: 25%;
        }

        .tab-item.active { color: var(--primary-blue); }
        .tab-item i { font-size: 24px; margin-bottom: 4px; }

        /* --- NEU: KONTAKTE STYLE --- */
        .contact-card {
            background: white;
            width: 100%;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .call-btn {
            background: var(--success-green);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: bold;
        }

        #confetti { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 80px; display: none; }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <section id="routine" class="active">
        <h1>Routine 🌙</h1>
        <div class="progress-container"><div id="progress-bar"></div></div>
         <div class="grid">
        <div class="card" onclick="toggleTask(this, 0)">
            <span class="icon">🍎</span>
            <span class="label">Abendessen</span>
        </div>
        <div class="card" onclick="toggleTask(this, 1)">
            <span class="icon">🧸</span>
            <span class="label">Aufräumen</span>
        </div>
        <div class="card" onclick="toggleTask(this, 2)">
            <span class="icon">🪥</span>
            <span class="label">Zähneputzen</span>
        </div>
        <div class="card" onclick="toggleTask(this, 3)">
            <span class="icon">👚</span>
            <span class="label">Schlafanzug</span>
        </div>
        <div class="card" onclick="toggleTask(this, 4)">
            <span class="icon">🧺</span>
            <span class="label">Wäschesack</span>
        </div>    
        <div class="card" onclick="toggleTask(this, 5)">
            <span class="icon">🪮</span>
            <span class="label">Haarekämmen</span>
        </div>
        <div id="confetti">🎉</div>
    </section>

    <section id="calendar">
        <h1>Kalender 📅</h1>
        <p>Hier kommt bald der Müll-Planer hin.</p>
        <div class="contact-card">
            <div><strong>Morgen:</strong> Restmüll 🗑️</div>
        </div>
    </section>

    <section id="contacts">
        <h1>Notfall-Kontakte 📞</h1>
        <div class="contact-card">
            <div><strong>Mama</strong><br><small>0170 1234567</small></div>
            <a href="tel:01701234567" class="call-btn">Anrufen</a>
        </div>
        <div class="contact-card">
            <div><strong>Papa</strong><br><small>0170 7654321</small></div>
            <a href="tel:01707654321" class="call-btn">Anrufen</a>
        </div>
    </section>

    <nav class="tab-bar">
        <a href="#" class="tab-item active" onclick="showTab('routine', this)">
            <i class="fas fa-check-circle"></i><span>Routine</span>
        </a>
        <a href="#" class="tab-item" onclick="showTab('calendar', this)">
            <i class="fas fa-calendar-alt"></i><span>Kalender</span>
        </a>
        <a href="#" class="tab-item" onclick="showTab('contacts', this)">
            <i class="fas fa-phone-alt"></i><span>Kontakte</span>
        </a>
    </nav>

    <script>
        // NAVIGATION LOGIK
        function showTab(tabId, element) {
            // Alle Sektionen verstecken
            document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
            // Gewählte Sektion zeigen
            document.getElementById(tabId).classList.add('active');
            
            // Tab-Bar Icons updaten
            document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
            element.classList.add('active');
        }

        // ROUTINE LOGIK (aus der vorherigen Version)
        window.onload = function() {
            const savedState = JSON.parse(localStorage.getItem('routineState')) || [false, false, false, false];
            const cards = document.querySelectorAll('#routine .card');
            cards.forEach((card, index) => { if (savedState[index]) card.classList.add('done'); });
            updateProgress();
        };

        function toggleTask(element, index) {
            element.classList.toggle('done');
            const cards = document.querySelectorAll('#routine .card');
            const state = Array.from(cards).map(card => card.classList.contains('done'));
            localStorage.setItem('routineState', JSON.stringify(state));
            updateProgress();
            if (navigator.vibrate) navigator.vibrate(40);
        }

        function updateProgress() {
            const total = document.querySelectorAll('#routine .card').length;
            const done = document.querySelectorAll('#routine .card.done').length;
            document.getElementById('progress-bar').style.width = (done/total*100) + '%';
            if (done === total) {
                document.getElementById('confetti').style.display = 'block';
                setTimeout(() => { document.getElementById('confetti').style.display = 'none'; }, 3000);
            }
        }
    </script>
</body>
</html>
