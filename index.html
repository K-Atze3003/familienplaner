<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FamilyHub Debug Mode</title>
    
    <script>
        window.onerror = function(msg, url, line, col, error) {
            // Ladebildschirm sofort töten
            var loader = document.getElementById('loading');
            if(loader) loader.style.display = 'none';
            
            alert("⚠️ KRITISCHER FEHLER:\n" + msg + "\n\nZeile: " + line);
            return false;
        };
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        /* (Styles bleiben gleich - verkürzt für Übersicht, funktionieren aber komplett) */
        :root { --bg-color: #f0f2f5; --primary-blue: #007aff; --success-green: #34c759; --danger-red: #ff3b30; --fav-yellow: #ffcc00; }
        body { font-family: -apple-system, sans-serif; background-color: var(--bg-color); margin: 0; padding-bottom: 110px; user-select: none; -webkit-user-select: none; }
        section { display: none; padding: 20px; flex-direction: column; align-items: center; }
        section.active { display: flex; }
        h1 { margin-top: 40px; text-align: center; }
        
        /* Loading Screen Style */
        .loading-screen { position: fixed; top:0; left:0; width:100%; height:100%; background:white; z-index:9999; display:flex; justify-content:center; align-items:center; font-size:20px; color:#999; flex-direction: column;}
        
        /* Restliche Styles aus vorherigem Code hier einfügen oder Standard nutzen */
        .card { background: white; border-radius: 20px; padding: 20px; margin: 10px; width: 90%; box-shadow: 0 2px 5px rgba(0,0,0,0.05); text-align: center; }
        .tab-bar { position: fixed; bottom: 0; width: 100%; height: 80px; background: white; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #ccc; }
        .tab-item { font-size: 20px; color: #999; }
        .tab-item.active { color: var(--primary-blue); }
        
        /* Routine Styles */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
        .card.done { background: #af52de; color: white; }
        .progress-container { width: 100%; height: 10px; background: #ddd; border-radius: 5px; margin: 10px 0; }
        .bar-fill { height: 100%; background: #af52de; width: 0%; transition: 0.3s; }
        
        /* Modal */
        .modal-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); display:none; align-items:center; justify-content:center; z-index:2000; }
        .modal-sheet { background: white; width: 90%; padding: 20px; border-radius: 20px; max-height: 80%; overflow-y: auto; }
        .modal-overlay.active { display: flex; }
    </style>
</head>
<body>
    
    <div id="loading" class="loading-screen">
        <i class="fas fa-spinner fa-spin" style="font-size: 40px; margin-bottom: 20px;"></i> 
        <div>Lade FamilyHub...</div>
        <div style="font-size: 12px; margin-top: 20px;">(Tippe hier, um abzubrechen)</div>
    </div>
    
    <script>
        document.getElementById('loading').addEventListener('click', function() {
            this.style.display = 'none';
        });
        // Automatischer Notaus nach 3 Sekunden
        setTimeout(function() {
            document.getElementById('loading').style.display = 'none';
        }, 3000);
    </script>

    <audio id="snd-click" src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3"></audio>

    <section id="routineMarlene" class="active">
        <h1>Marlene 🌙</h1>
        <div class="progress-container"><div class="bar-fill"></div></div>
        <div class="grid" id="gridMarlene">
            </div>
        <button onclick="resetRoutine()" style="margin-top:20px; padding:10px;">Reset</button>
    </section>

    <section id="routineLinda">
        <h1>Linda 🌙</h1>
        <div class="progress-container"><div class="bar-fill"></div></div>
        <div class="grid" id="gridLinda">
            </div>
        <button onclick="resetRoutine()" style="margin-top:20px; padding:10px;">Reset</button>
    </section>

    <nav class="tab-bar">
        <div class="tab-item active" onclick="showTab('routineMarlene', this)"><i class="fas fa-child"></i></div>
        <div class="tab-item" onclick="showTab('routineLinda', this)"><i class="fas fa-female"></i></div>
        <div class="tab-item" onclick="showTab('settings', this)"><i class="fas fa-cog"></i></div>
    </nav>
    
    <section id="settings">
        <h1>Einstellungen</h1>
        <p>Status: <span id="connStatus">Prüfe...</span></p>
    </section>

    <script>
        // --- HAUPT-LOGIK START ---
        
        // 1. Konfiguration
        const firebaseConfig = {
            apiKey: "AIzaSyB6gusTv4l6gQDK3EkU01hLCgX9EgVJrJQ",
            authDomain: "familyhub-e00ez41008068e19zz.firebaseapp.com",
            projectId: "familyhub-e00ez41008068e19zz",
            databaseURL: "https://familyhub-e00ez41008068e19zz-default-rtdb.europe-west1.firebasedatabase.app/",
            storageBucket: "familyhub-e00ez41008068e19zz.firebasestorage.app",
            messagingSenderId: "677777476532",
            appId: "1:677777476532:web:2568ffdc95dfda387980e1",
            measurementId: "G-FJRZVYTF49"
        };

        let db;
        let firebaseRoutine = { marlene: [], linda: [] };
        let globalPin = "0000";

        // 2. Initialisierung mit Fehlerprüfung
        try {
            if (!firebase.apps.length) { 
                firebase.initializeApp(firebaseConfig); 
            }
            db = firebase.database(); // Nimmt automatisch die URL aus Config
            console.log("Firebase gestartet.");
        } catch (e) {
            alert("Firebase Init Fehler: " + e.message);
        }

        // 3. Routine-Aufgaben definieren (Damit wir sie nicht im HTML hartcodieren müssen)
        const routineItems = [
            { icon: "🍽️", label: "Abendessen" },
            { icon: "🥣", label: "Geschirr" },
            { icon: "🧸", label: "Aufräumen" },
            { icon: "🦷", label: "Zähneputzen" },
            { icon: "pyjama", label: "Schlafanzug" }, // Platzhalter Icon
            { icon: "🧺", label: "Wäschekorb" },
            { icon: "💇‍♀️", label: "Kämmen" },
            { icon: "🚽", label: "Toilette" },
            { icon: "📖", label: "Geschichte" },
            { icon: "🛌", label: "Schlafen" }
        ];

        // 4. OnLoad
        window.onload = function() {
            console.log("Window loaded");
            
            // Verbindungstest
            db.ref(".info/connected").on("value", function(snap) {
                const stat = document.getElementById('connStatus');
                if (snap.val() === true) {
                    if(stat) stat.innerHTML = "✅ Verbunden";
                    if(stat) stat.style.color = "green";
                } else {
                    if(stat) stat.innerHTML = "❌ Nicht verbunden";
                    if(stat) stat.style.color = "red";
                }
            });

            // Routinen Rendern (HTML erzeugen)
            renderRoutineGrid('marlene', 'gridMarlene');
            renderRoutineGrid('linda', 'gridLinda');

            // Daten laden
            const todayStr = new Date().toISOString().split('T')[0];
            db.ref('routines/' + todayStr).on('value', (snap) => {
                const data = snap.val() || { marlene: [], linda: [] };
                firebaseRoutine = data;
                updateRoutineUI('routineMarlene', data.marlene || []);
                updateRoutineUI('routineLinda', data.linda || []);
            });

            // Ladebildschirm entfernen
            document.getElementById('loading').style.display = 'none';
        };

        // --- FUNKTIONEN ---

        function renderRoutineGrid(person, gridId) {
            const grid = document.getElementById(gridId);
            if(!grid) return;
            grid.innerHTML = "";
            routineItems.forEach((item, index) => {
                grid.innerHTML += `
                    <div class="card" onclick="toggleRoutineTask('${person}', ${index})">
                        <div style="font-size:30px;">${item.icon}</div>
                        <div>${item.label}</div>
                    </div>
                `;
            });
        }

        function toggleRoutineTask(person, index) {
            // Optimistisches Update
            let currentList = (firebaseRoutine && firebaseRoutine[person]) ? [...firebaseRoutine[person]] : [];
            
            if(currentList.includes(index)) {
                currentList = currentList.filter(i => i !== index);
            } else {
                currentList.push(index);
                // Sound
                const snd = document.getElementById('snd-click');
                if(snd) { snd.currentTime=0; snd.play().catch(e=>{}); }
            }

            // UI sofort updaten
            if(!firebaseRoutine) firebaseRoutine = {};
            firebaseRoutine[person] = currentList;
            const secId = person === 'marlene' ? 'routineMarlene' : 'routineLinda';
            updateRoutineUI(secId, currentList);

            // DB speichern
            const todayStr = new Date().toISOString().split('T')[0];
            db.ref(`routines/${todayStr}/${person}`).set(currentList).catch(e => alert("Speicherfehler: " + e.message));
        }

        function updateRoutineUI(sectionId, doneList) {
            const sec = document.getElementById(sectionId);
            if(!sec) return;
            const cards = sec.querySelectorAll('.card');
            const bar = sec.querySelector('.bar-fill');
            
            cards.forEach((c, i) => {
                if(doneList.includes(i)) c.classList.add('done');
                else c.classList.remove('done');
            });

            if(bar) {
                const pct = (doneList.length / cards.length) * 100;
                bar.style.width = pct + "%";
            }
        }

        function showTab(id, el) {
            document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
            const target = document.getElementById(id);
            if(target) target.classList.add('active');
            
            document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
            if(el) el.classList.add('active');
        }

        function resetRoutine() {
            if(confirm("Alles zurücksetzen?")) {
                const todayStr = new Date().toISOString().split('T')[0];
                db.ref(`routines/${todayStr}`).set({marlene:[], linda:[]});
            }
        }

    </script>
</body>
</html>
