<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Test</title>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body { font-family: sans-serif; padding: 20px; }
        button { padding: 15px; font-size: 20px; background: lime; display: block; margin: 10px 0; width: 100%; }
        input { padding: 10px; font-size: 18px; width: 100%; margin-bottom: 10px; }
        #log { background: #eee; padding: 10px; border: 1px solid #333; height: 300px; overflow: scroll; font-family: monospace; }
        .error { color: red; font-weight: bold; }
        .success { color: green; font-weight: bold; }
    </style>
</head>
<body>

    <h1>🔥 Datenbank Test</h1>
    
    <p>1. Gib einen Text ein:</p>
    <input type="text" id="testInput" placeholder="Hallo Welt">
    
    <p>2. Drücke den Knopf:</p>
    <button onclick="runTest()">TEST SPEICHERN</button>

    <p>3. Protokoll:</p>
    <div id="log">Warte auf Start...<br></div>

    <script>
        // Logger Funktion
        function log(msg, type="") {
            const el = document.getElementById('log');
            const color = type === 'err' ? 'red' : (type === 'ok' ? 'green' : 'black');
            el.innerHTML += `<span style="color:${color}">[${new Date().toLocaleTimeString()}] ${msg}</span><br>`;
            console.log(msg);
        }

        // --- KONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyB6gusTv4l6gQDK3EkU01hLCgX9EgVJrJQ",
            authDomain: "familyhub-e00ez41008068e19zz.firebaseapp.com",
            projectId: "familyhub-e00ez41008068e19zz",
            // WICHTIG: Die URL
            databaseURL: "https://familyhub-e00ez41008068e19zz-default-rtdb.europe-west1.firebasedatabase.app/",
            appId: "1:677777476532:web:2568ffdc95dfda387980e1"
        };

        let db;

        // Startversuch
        try {
            log("Starte Firebase...");
            if (!firebase.apps.length) { 
                firebase.initializeApp(firebaseConfig); 
                log("Firebase App initialisiert.");
            }
            db = firebase.database();
            log("Datenbank-Referenz erstellt.", "ok");

            // Verbindungstest
            db.ref(".info/connected").on("value", function(snap) {
                if (snap.val() === true) {
                    log("✅ ONLINE! Verbunden mit Server.", "ok");
                } else {
                    log("⚠️ OFFLINE. Suche Verbindung...");
                }
            });

        } catch (e) {
            log("❌ KRITISCHER START-FEHLER: " + e.message, "err");
            alert("Fehler: " + e.message);
        }

        // Die Test-Funktion
        function runTest() {
            const val = document.getElementById('testInput').value || "Test-Eintrag";
            log(`Versuche "${val}" zu speichern...`);

            // Wir schreiben in einen Test-Pfad
            db.ref('test_verbindung').set({
                nachricht: val,
                zeit: new Date().toString()
            })
            .then(() => {
                log("🎉 GESPEICHERT! Es funktioniert!", "ok");
                alert("Erfolg! Die Datenbank funktioniert.");
            })
            .catch((error) => {
                log("❌ FEHLER BEIM SPEICHERN:", "err");
                log(error.message, "err");
                log("Code: " + error.code, "err");
                
                if(error.code === "PERMISSION_DENIED") {
                    alert("Zugriff verweigert! Die Regeln stehen auf 'false'.");
                } else {
                    alert("Fehler: " + error.message);
                }
            });
        }
    </script>
</body>
</html>
